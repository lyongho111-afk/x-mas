<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merry Christmas - 따뜻한 크리스마스 카드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Noto+Serif+KR:wght@400;600&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    font-family: 'Noto Serif KR', serif;
    background-color: #0b132b;
    color: #fffdf7;
  }

  /* 전체 배경 이미지 - 선명도 최대화 */
  .bg-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('background.png'), url('image_590a4931.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
    filter: brightness(1.02) contrast(1.03);
  }

  /* 배경 위 아주 은은한 비네팅만 적용 */
  .bg-vignette {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(0, 0, 0, 0.05) 50%, rgba(5, 10, 25, 0.35) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* 은은한 빛줄기 효과 */
  .light-rays {
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 140vw;
    height: 140vh;
    background: conic-gradient(
      from 160deg at 50% 0%,
      transparent 0deg,
      rgba(255, 232, 163, 0.08) 15deg,
      transparent 30deg,
      rgba(255, 220, 140, 0.06) 45deg,
      transparent 60deg
    );
    pointer-events: none;
    z-index: 2;
    animation: raySway 9s ease-in-out infinite alternate;
  }

  @keyframes raySway {
    0% { transform: translateX(-52%) rotate(-2deg); opacity: 0.7; }
    100% { transform: translateX(-48%) rotate(2deg); opacity: 1; }
  }

  /* 하트 및 반짝임 캔버스 */
  #particleCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  /* 메인 레이아웃 */
  .wrapper {
    position: relative;
    z-index: 4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px 16px 88px;
  }

  /* 편지지 카드: 블러(흐림) 완전 제거 및 초고투명 처리 */
  .card {
    width: 100%;
    max-width: 540px;
    padding: 40px 30px;
    border-radius: 20px;
    background: linear-gradient(
      180deg,
      rgba(12, 18, 34, 0.16) 0%,
      rgba(18, 14, 24, 0.22) 100%
    );
    border: 1.5px solid rgba(255, 223, 145, 0.65);
    box-shadow:
      0 12px 36px rgba(0, 0, 0, 0.35),
      inset 0 0 24px rgba(255, 223, 145, 0.12);
    text-align: center;
  }

  /* 위에서 아래로 내려오는 글씨 애니메이션 */
  .reveal-line {
    opacity: 0;
    transform: translateY(-22px);
    animation: dropDownFade 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.92),
      0 0 14px rgba(0, 0, 0, 0.85),
      0 0 24px rgba(10, 15, 30, 0.75);
  }

  .delay-1 { animation-delay: 0.2s; }
  .delay-2 { animation-delay: 0.65s; }
  .delay-3 { animation-delay: 1.1s; }
  .delay-4 { animation-delay: 1.55s; }
  .delay-5 { animation-delay: 2.0s; }
  .delay-6 { animation-delay: 2.45s; }

  @keyframes dropDownFade {
    0% {
      opacity: 0;
      transform: translateY(-22px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    letter-spacing: 0.28em;
    color: #ffe39f;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.1rem, 6vw, 2.9rem);
    font-weight: 600;
    color: #fff6db;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }

  .divider {
    width: 72px;
    height: 1.5px;
    margin: 0 auto 24px;
    background: linear-gradient(90deg, transparent, #ffd97d, transparent);
  }

  .message p {
    font-size: clamp(0.98rem, 3.6vw, 1.1rem);
    line-height: 1.95;
    color: #ffffff;
    margin-bottom: 14px;
    word-break: keep-all;
    font-weight: 400;
  }

  .signature {
    margin-top: 26px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #ffe39f;
    letter-spacing: 0.06em;
  }

  /* 하단 컨트롤 바 */
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    width: max-content;
    max-width: 94vw;
  }

  .btn {
    appearance: none;
    border: 1px solid rgba(255, 223, 145, 0.7);
    background: rgba(15, 22, 40, 0.72);
    color: #fff6db;
    padding: 10px 18px;
    border-radius: 999px;
    font-family: 'Noto Serif KR', serif;
    font-size: 0.88rem;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    background: rgba(255, 223, 145, 0.25);
    border-color: #ffe8a3;
    transform: translateY(-1px);
  }

  .btn.active {
    background: rgba(212, 163, 78, 0.45);
    border-color: #fff0c2;
  }

  #bgInput {
    display: none;
  }

  @media (max-width: 480px) {
    .card {
      padding: 32px 20px;
    }
    .btn {
      padding: 9px 14px;
      font-size: 0.82rem;
    }
  }
</style>
</head>
<body>

  <div class="bg-container" id="bgContainer"></div>
  <div class="bg-vignette"></div>
  <div class="light-rays"></div>
  <canvas id="particleCanvas"></canvas>

  <main class="wrapper">
    <article class="card">
      <div class="subtitle reveal-line delay-1">Season's Greetings</div>
      <h1 class="title reveal-line delay-2">Merry Christmas</h1>
      <div class="divider reveal-line delay-2"></div>

      <div class="message">
        <p class="reveal-line delay-3">
          하얀 눈이 소복이 내려앉은 고요한 겨울밤,<br>
          창가에 비치는 따뜻한 불빛처럼<br>
          당신의 하루에도 포근한 온기가 가득하길 바랍니다.
        </p>
        <p class="reveal-line delay-4">
          올 한 해 수고 많으셨습니다.<br>
          소중한 사람들과 함께 웃음꽃 피우는<br>
          행복한 크리스마스 보내세요.
        </p>
        <p class="reveal-line delay-5">
          다가오는 새해에는 바라시는 모든 일들이<br>
          눈꽃처럼 아름답게 피어나길 진심으로 기원합니다.
        </p>
      </div>

      <div class="signature reveal-line delay-6">
        따뜻한 마음을 담아 보냅니다
      </div>
    </article>
  </main>

  <div class="controls">
    <button type="button" class="btn" id="musicBtn">🎵 음악 켜기</button>
    <label for="bgInput" class="btn">🖼️ 배경 사진 선택</label>
    <input type="file" id="bgInput" accept="image/*">
  </div>

<script>
  // 1. 배경 사진 직접 불러오기 기능
  const bgInput = document.getElementById('bgInput');
  const bgContainer = document.getElementById('bgContainer');

  bgInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      bgContainer.style.backgroundImage = `url('${event.target.result}')`;
    };
    reader.readAsDataURL(file);
  });

  // 2. 은은한 하트 및 금빛 반짝임 애니메이션
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  let particles = [];

  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor() {
      this.reset(true);
    }
    reset(initial = false) {
      this.x = Math.random() * width;
      this.y = initial ? Math.random() * height : height + 20;
      this.isHeart = Math.random() < 0.35;
      this.size = this.isHeart ? (Math.random() * 6 + 5) : (Math.random() * 2.2 + 1);
      this.speedY = -(Math.random() * 0.45 + 0.2);
      this.speedX = (Math.random() - 0.5) * 0.35;
      this.alpha = Math.random() * 0.45 + 0.2;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.008;
      this.color = this.isHeart
        ? (Math.random() < 0.5 ? '255, 195, 205' : '255, 223, 155')
        : '255, 240, 190';
    }
    update() {
      this.wobble += this.wobbleSpeed;
      this.x += this.speedX + Math.sin(this.wobble) * 0.25;
      this.y += this.speedY;
      if (this.y < -30) {
        this.reset(false);
      }
    }
    drawHeart(x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.4, 0, size);
      ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.4, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.closePath();
      ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
      ctx.shadowColor = `rgba(${this.color}, 0.6)`;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.restore();
    }
    draw() {
      if (this.isHeart) {
        this.drawHeart(this.x, this.y, this.size);
      } else {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color}, ${this.alpha + 0.15})`;
        ctx.shadowColor = 'rgba(255, 230, 160, 0.8)';
        ctx.shadowBlur = 6;
        ctx.fill();
      }
    }
  }

  const count = Math.min(42, Math.floor(window.innerWidth / 22));
  for (let i = 0; i < count; i++) {
    particles.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, width, height);
    for (const p of particles) {
      p.update();
      p.draw();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // 3. 잔잔한 크리스마스 오르골 멜로디 (Web Audio API)
  let audioCtx = null;
  let isPlaying = false;
  let melodyTimer = null;
  let noteIndex = 0;

  // Silent Night (고요한 밤 거룩한 밤) 오르골 음계
  const melody = [
    { f: 392.00, d: 0.75 }, { f: 440.00, d: 0.25 }, { f: 392.00, d: 0.5 }, { f: 329.63, d: 1.5 },
    { f: 392.00, d: 0.75 }, { f: 440.00, d: 0.25 }, { f: 392.00, d: 0.5 }, { f: 329.63, d: 1.5 },
    { f: 587.33, d: 1.0 },  { f: 587.33, d: 0.5 },  { f: 493.88, d: 1.5 },
    { f: 523.25, d: 1.0 },  { f: 523.25, d: 0.5 },  { f: 392.00, d: 1.5 },
    { f: 440.00, d: 1.0 },  { f: 440.00, d: 0.5 },  { f: 523.25, d: 0.75 }, { f: 493.88, d: 0.25 }, { f: 440.00, d: 0.5 },
    { f: 392.00, d: 0.75 }, { f: 440.00, d: 0.25 }, { f: 392.00, d: 0.5 }, { f: 329.63, d: 1.5 },
    { f: 587.33, d: 1.0 },  { f: 587.33, d: 0.5 },  { f: 659.25, d: 0.75 }, { f: 587.33, d: 0.25 }, { f: 493.88, d: 0.5 },
    { f: 523.25, d: 1.5 },  { f: 659.25, d: 1.5 },
    { f: 523.25, d: 0.75 }, { f: 392.00, d: 0.25 }, { f: 329.63, d: 0.5 }, { f: 392.00, d: 0.75 }, { f: 349.23, d: 0.25 }, { f: 293.66, d: 0.5 },
    { f: 261.63, d: 2.2 }
  ];

  function playMusicBoxNote(freq, duration) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const overtone = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const overGain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    overtone.type = 'sine';
    overtone.frequency.setValueAtTime(freq * 2, now);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.14, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + duration + 0.8);

    overGain.gain.setValueAtTime(0.001, now);
    overGain.gain.exponentialRampToValueAtTime(0.035, now + 0.02);
    overGain.gain.exponentialRampToValueAtTime(0.0005, now + 0.45);

    osc.connect(gain);
    overtone.connect(overGain);
    gain.connect(audioCtx.destination);
    overGain.connect(audioCtx.destination);

    osc.start(now);
    overtone.start(now);
    osc.stop(now + duration + 0.9);
    overtone.stop(now + 0.5);
  }

  function scheduleNextNote() {
    if (!isPlaying) return;
    const note = melody[noteIndex];
    playMusicBoxNote(note.f, note.d);
    noteIndex = (noteIndex + 1) % melody.length;
    melodyTimer = setTimeout(scheduleNextNote, note.d * 680);
  }

  const musicBtn = document.getElementById('musicBtn');
  musicBtn.addEventListener('click', () => {
    if (!isPlaying) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      isPlaying = true;
      musicBtn.textContent = '⏸️ 음악 끄기';
      musicBtn.classList.add('active');
      scheduleNextNote();
    } else {
      isPlaying = false;
      clearTimeout(melodyTimer);
      musicBtn.textContent = '🎵 음악 켜기';
      musicBtn.classList.remove('active');
    }
  });
</script>
</body>
</html>
